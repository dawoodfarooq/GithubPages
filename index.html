<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Websites</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #343a40;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --gray-color: #6c757d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark-color);
            background-color: var(--light-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex: 1;
        }
        
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .site-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .site-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        .site-image {
            height: 200px;
            overflow: hidden;
        }
        
        .site-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .site-card:hover .site-image img {
            transform: scale(1.05);
        }
        
        .site-content {
            padding: 1.5rem;
        }
        
        .site-content h2 {
            margin-bottom: 0.75rem;
            font-size: 1.5rem;
            color: var(--dark-color);
        }
        
        .site-content p {
            color: var(--gray-color);
            margin-bottom: 1.25rem;
        }
        
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        
        .btn:hover {
            background-color: #0a58ca;
        }
        
        footer {
            background-color: var(--dark-color);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
        }
        
        .add-site {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem;
            background-color: rgba(13, 110, 253, 0.1);
            border-radius: 8px;
            border: 2px dashed var(--primary-color);
        }
        
        .add-site h2 {
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            header {
                padding: 2rem 1rem;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 1.5rem 1rem;
            }
            
            .sites-grid {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>My GitHub Pages Websites</h1>
        <p>Collection of websites hosted on GitHub Pages</p>
    </header>
    
    <div class="container">
        <div class="sites-grid
